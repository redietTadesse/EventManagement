# ==============================================
# AICC Event Management System
# Application Configuration
# ==============================================

# ─── Server ──────────────────────────────────
server.port=8080
spring.application.name=event-management

# ─── Database ───────────────────────────────
# MySQL configuration with environment variable support
spring.datasource.url=jdbc:mysql://localhost:3306/aicc_events?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA ────────────────────────────────────
# Validate schema against entities (Flyway manages the schema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ─── Flyway (Database Migrations) ──────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# ─── App Configuration ─────────────────────
# Base URL used by OpenAPI and email/SMS services
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ─── Logging ───────────────────────────────
# Set to DEBUG for development, INFO for production
logging.level.com.aicc.eventmanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ─── Swagger / OpenAPI ─────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=true


# ─── JWT Configuration ───
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}