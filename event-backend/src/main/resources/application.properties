# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}

# ==========================================
# DATABASE (MySQL)
# ==========================================
# Uses environment variables on Render, falls back to localhost for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aicc_events?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY (Database Migrations)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false

# ==========================================
# APP CONFIGURATION
# ==========================================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET:MySuperSecretKeyForJWTThatIsLongEnoughForHS256Algorithm}
jwt.expirationMs=86400000

# ==========================================
# CORS
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
app.email.enabled=true
app.email.from=noreply@aicc.et

# SMTP Settings (Gmail example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.recipient-override=

# ==========================================
# ACTUATOR (Health checks for Render)
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ==========================================
# LOGGING
# ==========================================
logging.level.com.aicc.eventmanagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN