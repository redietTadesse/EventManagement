# ==============================================
# AICC Event Management System
# Application Configuration - TESTING
# ==============================================

# ─── Server ──────────────────────────────────
server.port=8080
spring.application.name=event-management

# ─── Database (MySQL) ──────────────────────
# Update these to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/aicc_events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Connection Pool ────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# ─── JPA ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

# ─── Flyway (Database Migrations) ──────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false

# ─── App Configuration ─────────────────────
app.base-url=http://localhost:8080

# ─── Logging ───────────────────────────────
logging.level.com.aicc.eventmanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ─── Swagger / OpenAPI ─────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=true

# ─── JWT Configuration ─────────────────────
jwt.secret=MySuperSecretKeyForJWTThatIsAtLeast32Chars!
jwt.expirationMs=86400000

# ─── CORS ──────────────────────────────────
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ─── Actuator ──────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always