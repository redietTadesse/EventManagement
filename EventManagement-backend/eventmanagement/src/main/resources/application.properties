# ==============================================
# AICC Event Management System
# Application Configuration
# ==============================================

# ─── Server ──────────────────────────────────
server.port=8080
spring.application.name=event-management

# ─── Database ───────────────────────────────
# H2 database for testing purposes
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA ────────────────────────────────────
# Validate schema against entities (Flyway manages the schema)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ─── H2 Console ─────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Flyway (Database Migrations) ──────────
# Temporarily disable Flyway to allow app to start with H2
spring.flyway.enabled=false

# ─── App Configuration ─────────────────────
# Base URL used by OpenAPI and email/SMS services
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ─── Logging ───────────────────────────────
# Set to DEBUG for development, INFO for production
logging.level.com.aicc.eventmanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ─── Swagger / OpenAPI ─────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=true


# ─── JWT Configuration ───
# 34-char default (>= 256 bits for HS256); override with the JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:myDefaultSecretKey12345678901234567}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}